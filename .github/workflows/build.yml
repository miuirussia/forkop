name: Build packages

# Run by hand (Actions, Build packages, Run workflow) from an X.Y.Z tag: it builds the release's
# packages and drafts its GitHub release with them, install.sh, release.json and SHA256SUMS.
# Publishing the draft by hand makes it the latest release, the one install.sh installs and every
# Forkop's update check offers.
# Build on main when the build setup changes to seed the default-branch SDK cache:
# release tags can restore it, but cannot restore caches saved under other tags.
on:
  push:
    branches:
      - main
    paths:
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      install_command:
        description: "Only for a release the Components tab must not install itself: the command that installs it"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Check the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != tag ] || ! [[ "$REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A release is built from its X.Y.Z tag: choose the tag in Use workflow from"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y aria2 build-essential curl fakeroot file gawk git patch perl tar unzip util-linux xz-utils zstd

      - name: Cache OpenWrt SDKs
        uses: actions/cache@v4.3.0
        with:
          path: ${{ runner.temp }}/openwrt-sdk
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-openwrt-sdk-v1-${{ hashFiles('build.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-openwrt-sdk-v1-

      - name: Build
        env:
          SDK_CACHE_DIR: ${{ runner.temp }}/openwrt-sdk
          INSTALL_COMMAND: ${{ inputs.install_command }}
          TAG: ${{ github.event_name == 'push' && '0.0.0' || github.ref_name }}
        run: ./build.sh "$TAG" "$PWD/release"

      - name: Upload the release files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release
          path: release/*
          retention-days: 1
          if-no-files-found: error

  release:
    name: Draft the release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Draft the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::The release $TAG is published already: its files stay as they are"
              exit 1
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" --clobber -- release/*
